aid: olive-technologies
name: Olive Technologies
description: >-
  Olive is an AI-native vendor evaluation and technology procurement platform
  that runs the full RFP lifecycle in a single workspace — from requirements
  management and stakeholder collaboration through AI-powered comparative vendor
  scoring and final selection. It maintains vendor intelligence across more than
  12,000 vendors and 380+ categories, and is built for IT leaders, procurement
  teams, and consultancies who need unbiased, structured software sourcing.
  Olive is a Techstars-backed company; by design it takes no fees from vendors,
  funding the platform through buyer subscriptions instead. Olive has no public
  developer API surface — no documentation, SDKs, or API reference are published
  at this time; this profile captures the company's public web and security
  posture.
